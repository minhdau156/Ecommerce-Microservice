spring:
  application:
    name: config-server
  profiles:
    active: native
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    config:
      server:
        native:
          # Override with CONFIG_PATH (e.g. in Docker). Defaults cover running from the repo root or from config-server/.
          search-locations: ${CONFIG_PATH:file:./config-server/src/main/resources/config/,file:./src/main/resources/config/}
server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: "*"